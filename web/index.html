<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monki Labs</title>

    <style>
        :root {

            --bg:
                #07080b;

            --bg-soft:
                #0b0d11;

            --panel:
                rgba(18, 21, 28, 0.82);

            --panel-solid:
                #12151c;

            --panel-light:
                rgba(27, 31, 40, 0.88);

            --border:
                rgba(255, 255, 255, 0.075);

            --border-strong:
                rgba(255, 255, 255, 0.13);

            --text:
                #f5f7fa;

            --muted:
                #7f8794;

            --muted-light:
                #aeb5c0;

            --accent:
                #a4ff63;

            --accent-bright:
                #c5ff9c;

            --accent-soft:
                rgba(164, 255, 99, 0.10);

            --accent-glow:
                rgba(164, 255, 99, 0.20);

            --purple:
                #9c7cff;

            --purple-soft:
                rgba(156, 124, 255, 0.11);

            --blue:
                #68a7ff;

            --danger:
                #ff6464;

            --shadow:
                0 24px 80px rgba(0, 0, 0, 0.38);

            --radius:
                20px;

        }


        * {

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            color:
                var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(circle at 8% 0%,
                    rgba(164, 255, 99, 0.075),
                    transparent 24%),

                radial-gradient(circle at 92% 4%,
                    rgba(156, 124, 255, 0.09),
                    transparent 27%),

                radial-gradient(circle at 50% 70%,
                    rgba(70, 120, 255, 0.035),
                    transparent 35%),

                linear-gradient(180deg,
                    #07080b 0%,
                    #0a0c10 45%,
                    #07080b 100%);

        }


        body::before {

            content:
                "";

            position:
                fixed;

            inset:
                0;

            pointer-events:
                none;

            background-image:

                linear-gradient(rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px),

                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px);

            background-size:
                42px 42px;

            mask-image:
                linear-gradient(to bottom,
                    black,
                    transparent 80%);

            z-index:
                0;

        }


        body::after {

            content:
                "";

            position:
                fixed;

            width:
                700px;

            height:
                700px;

            left:
                50%;

            top:
                25%;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(circle,
                    rgba(164, 255, 99, 0.018),
                    transparent 65%);

            pointer-events:
                none;

            z-index:
                0;

        }


        button,
        video {

            font-family:
                inherit;

        }


        button {

            border:
                1px solid rgba(255, 255, 255, 0.09);

            border-radius:
                12px;

            padding:
                11px 16px;

            background:
                linear-gradient(180deg,
                    #ffffff,
                    #dce1e6);

            color:
                #080a0d;

            font-size:
                13px;

            font-weight:
                850;

            letter-spacing:
                -0.1px;

            cursor:
                pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                opacity 0.18s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255, 255, 255, 0.09);

        }


        button:active {

            transform:
                translateY(0);

        }


        button:disabled {

            opacity:
                0.32;

            cursor:
                not-allowed;

            transform:
                none;

            box-shadow:
                none;

        }


        .primary-button {

            position:
                relative;

            overflow:
                hidden;

            background:
                linear-gradient(135deg,
                    #d0ffa9,
                    #94ed5b);

            border-color:
                rgba(164, 255, 99, 0.35);

            box-shadow:
                0 10px 35px rgba(164, 255, 99, 0.10);

        }


        .primary-button::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                -120%;

            width:
                80%;

            height:
                100%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.35),
                    transparent);

            transform:
                skewX(-20deg);

            transition:
                left 0.6s ease;

        }


        .primary-button:hover::before {

            left:
                140%;

        }


        .secondary {

            background:
                rgba(255, 255, 255, 0.045);

            border-color:
                var(--border);

            color:
                #d9dde3;

        }


        .container {

            width:
                min(1540px, 94%);

            margin:
                0 auto;

            padding:
                32px 0 70px;

            position:
                relative;

            z-index:
                1;

        }


        /* ==================================================
           HERO
        ================================================== */

        .hero {

            position:
                relative;

            overflow:
                hidden;

            min-height:
                205px;

            padding:
                34px 36px;

            border:
                1px solid var(--border);

            border-radius:
                28px;

            background:

                linear-gradient(135deg,
                    rgba(27, 31, 39, 0.96),
                    rgba(12, 14, 19, 0.96));

            box-shadow:
                var(--shadow);

        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            width:
                420px;

            height:
                420px;

            right:
                -150px;

            top:
                -250px;

            border-radius:
                50%;

            background:
                var(--accent);

            filter:
                blur(120px);

            opacity:
                0.09;

            pointer-events:
                none;

        }


        .hero::after {

            content:
                "";

            position:
                absolute;

            width:
                350px;

            height:
                350px;

            left:
                -190px;

            bottom:
                -250px;

            border-radius:
                50%;

            background:
                var(--purple);

            filter:
                blur(120px);

            opacity:
                0.09;

            pointer-events:
                none;

        }


        .hero-grid {

            position:
                absolute;

            inset:
                0;

            background-image:

                linear-gradient(rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px),

                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px);

            background-size:
                32px 32px;

            mask-image:
                radial-gradient(circle at center,
                    black,
                    transparent 75%);

            pointer-events:
                none;

        }


        .hero-content {

            position:
                relative;

            z-index:
                2;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                30px;

            min-height:
                137px;

        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                22px;

        }


        .monkey-logo {

            position:
                relative;

            width:
                102px;

            height:
                102px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid rgba(164, 255, 99, 0.20);

            border-radius:
                25px;

            background:

                linear-gradient(145deg,
                    rgba(164, 255, 99, 0.11),
                    rgba(156, 124, 255, 0.08));

            box-shadow:

                inset 0 1px 0 rgba(255, 255, 255, 0.06),

                0 0 55px rgba(164, 255, 99, 0.07);

        }


        .monkey-logo::before {

            content:
                "";

            position:
                absolute;

            inset:
                9px;

            border:
                1px solid rgba(255, 255, 255, 0.035);

            border-radius:
                18px;

        }


        .monkey-logo span {

            position:
                relative;

            z-index:
                2;

            font-size:
                52px;

            filter:
                drop-shadow(0 7px 14px rgba(0, 0, 0, 0.55));

            animation:
                monkeyFloat 4s ease-in-out infinite;

        }


        @keyframes monkeyFloat {

            0%,
            100% {

                transform:
                    translateY(0) rotate(0deg);

            }

            50% {

                transform:
                    translateY(-4px) rotate(2deg);

            }

        }


        .brand h1 {

            margin:
                0;

            font-size:
                clamp(34px, 4vw, 50px);

            line-height:
                0.95;

            letter-spacing:
                -2.5px;

            font-weight:
                950;

        }


        .brand h1 span {

            color:
                var(--accent);

            text-shadow:
                0 0 30px rgba(164, 255, 99, 0.16);

        }


        .subtitle {

            margin-top:
                11px;

            color:
                var(--muted);

            font-size:
                14px;

            letter-spacing:
                0.25px;

        }


        .hero-status {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-end;

            gap:
                9px;

        }


        .status-pill {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                9px 13px;

            border:
                1px solid rgba(164, 255, 99, 0.16);

            border-radius:
                999px;

            background:
                rgba(164, 255, 99, 0.055);

            color:
                #c9ffad;

            font-size:
                11px;

            font-weight:
                850;

            letter-spacing:
                0.6px;

        }


        .status-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--accent);

            box-shadow:
                0 0 14px var(--accent);

            animation:
                pulse 2s infinite;

        }


        .status-caption {

            color:
                #555d68;

            font-size:
                10px;

            letter-spacing:
                0.8px;

            text-transform:
                uppercase;

        }


        @keyframes pulse {

            0%,
            100% {

                opacity:
                    1;

                transform:
                    scale(1);

            }

            50% {

                opacity:
                    0.45;

                transform:
                    scale(0.72);

            }

        }


        /* ==================================================
           SECTION BAR
        ================================================== */

        .topbar {

            margin-top:
                32px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                18px;

            flex-wrap:
                wrap;

        }


        .section-heading {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        .section-icon {

            width:
                34px;

            height:
                34px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid var(--border);

            border-radius:
                10px;

            background:
                rgba(255, 255, 255, 0.035);

            font-size:
                15px;

        }


        .section-heading h2 {

            margin:
                0;

            font-size:
                22px;

            letter-spacing:
                -0.5px;

        }


        .episode-count {

            min-width:
                30px;

            height:
                28px;

            padding:
                0 9px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid var(--border);

            border-radius:
                999px;

            background:
                rgba(255, 255, 255, 0.035);

            color:
                var(--muted-light);

            font-size:
                11px;

            font-weight:
                900;

        }


        /* ==================================================
           PROGRESS
        ================================================== */

        .progress-section {

            position:
                relative;

            margin-top:
                18px;

            padding:
                17px 19px;

            overflow:
                hidden;

            border:
                1px solid var(--border);

            border-radius:
                16px;

            background:
                rgba(18, 21, 27, 0.65);

            backdrop-filter:
                blur(14px);

        }


        .progress-section::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            width:
                140px;

            height:
                1px;

            background:
                linear-gradient(90deg,
                    var(--accent),
                    transparent);

        }


        .progress-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                #dce0e6;

            font-size:
                12px;

            font-weight:
                850;

            letter-spacing:
                0.1px;

        }


        .progress-title::before {

            content:
                "⚙";

            color:
                var(--accent);

        }


        .progress-wrapper {

            display:
                none;

            margin-top:
                13px;

        }


        .progress-wrapper.active {

            display:
                block;

        }


        .progress-bar {

            width:
                100%;

            height:
                9px;

            overflow:
                hidden;

            border:
                1px solid rgba(255, 255, 255, 0.035);

            border-radius:
                999px;

            background:
                #1c2027;

        }


        .progress-fill {

            width:
                0%;

            height:
                100%;

            border-radius:
                inherit;

            background:
                linear-gradient(90deg,
                    var(--purple),
                    var(--accent));

            box-shadow:
                0 0 20px rgba(164, 255, 99, 0.35);

            transition:
                width 0.25s ease;

        }


        .progress-text {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                12px;

            margin-top:
                8px;

            color:
                #858d99;

            font-size:
                11px;

        }


        .error {

            margin-top:
                13px;

            padding:
                11px 13px;

            border:
                1px solid rgba(255, 70, 70, 0.18);

            border-radius:
                10px;

            background:
                rgba(255, 70, 70, 0.07);

            color:
                #ff9d9d;

            display:
                none;

            font-size:
                12px;

        }


        /* ==================================================
           EPISODE GRID
        ================================================== */

        .episodes {

            margin-top:
                18px;

            display:
                grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(270px,
                        1fr));

            gap:
                17px;

        }


        .episode-card {

            position:
                relative;

            min-width:
                0;

            overflow:
                hidden;

            padding:
                17px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            background:

                linear-gradient(145deg,
                    rgba(24, 28, 36, 0.92),
                    rgba(13, 16, 21, 0.94));

            box-shadow:
                0 12px 38px rgba(0, 0, 0, 0.20);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        .episode-card::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            right:
                0;

            top:
                0;

            height:
                1px;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(164, 255, 99, 0.30),
                    transparent);

            opacity:
                0;

            transition:
                opacity 0.25s ease;

        }


        .episode-card::after {

            content:
                "";

            position:
                absolute;

            width:
                130px;

            height:
                130px;

            right:
                -90px;

            top:
                -90px;

            border-radius:
                50%;

            background:
                var(--accent);

            filter:
                blur(55px);

            opacity:
                0;

            transition:
                opacity 0.3s ease;

            pointer-events:
                none;

        }


        .episode-card:hover {

            transform:
                translateY(-5px);

            border-color:
                var(--border-strong);

            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.32);

        }


        .episode-card:hover::before,
        .episode-card:hover::after {

            opacity:
                1;

        }


        .episode-header {

            position:
                relative;

            z-index:
                2;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

        }


        .episode-number {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-width:
                54px;

            height:
                31px;

            padding:
                0 10px;

            border:
                1px solid rgba(164, 255, 99, 0.16);

            border-radius:
                9px;

            background:
                var(--accent-soft);

            color:
                #caffb1;

            font-size:
                12px;

            font-weight:
                950;

            letter-spacing:
                0.5px;

        }


        .episode-category {

            max-width:
                58%;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            color:
                #69717d;

            font-size:
                9px;

            font-weight:
                850;

            text-transform:
                uppercase;

            letter-spacing:
                0.9px;

        }


        .episode-content {

            position:
                relative;

            z-index:
                2;

            margin-top:
                17px;

            display:
                flex;

            flex-direction:
                column;

            min-width:
                0;

        }


        .label {

            color:
                #626b77;

            font-size:
                9px;

            font-weight:
                900;

            text-transform:
                uppercase;

            letter-spacing:
                1.05px;

        }


        .title {

            margin-top:
                7px;

            color:
                #f3f5f7;

            font-size:
                16px;

            line-height:
                1.3;

            font-weight:
                850;

            letter-spacing:
                -0.25px;

        }


        .prompt {

            margin-top:
                9px;

            color:
                #9ba3ae;

            font-size:
                12px;

            line-height:
                1.55;

        }


        .prompt-empty {

            margin-top:
                8px;

            color:
                #555e69;

            font-size:
                12px;

        }


        /* ==================================================
           VIDEO
        ================================================== */

        .video-panel {

            min-width:
                0;

            margin-top:
                17px;

            padding-top:
                15px;

            border-top:
                1px solid rgba(255, 255, 255, 0.055);

        }


        .video-heading {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                8px;

        }


        .video-status {

            margin-top:
                5px;

            color:
                #6e7783;

            font-size:
                10px;

        }


        .video-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            padding:
                4px 7px;

            border:
                1px solid rgba(164, 255, 99, 0.14);

            border-radius:
                999px;

            background:
                rgba(164, 255, 99, 0.055);

            color:
                #bdfc9a;

            font-size:
                8px;

            font-weight:
                900;

            text-transform:
                uppercase;

            letter-spacing:
                0.7px;

        }


        .video-badge::before {

            content:
                "";

            width:
                5px;

            height:
                5px;

            border-radius:
                50%;

            background:
                var(--accent);

            box-shadow:
                0 0 8px var(--accent);

        }


        video {

            width:
                100%;

            aspect-ratio:
                9 / 16;

            object-fit:
                contain;

            margin-top:
                10px;

            display:
                block;

            border:
                1px solid rgba(255, 255, 255, 0.085);

            border-radius:
                13px;

            background:
                #020304;

            box-shadow:
                0 18px 38px rgba(0, 0, 0, 0.40);

        }


        video:hover {

            border-color:
                rgba(164, 255, 99, 0.20);

        }


        .actions {

            margin-top:
                11px;

            display:
                flex;

            gap:
                8px;

            flex-wrap:
                wrap;

        }


        .actions button {

            flex:
                1;

            min-width:
                0;

            padding:
                9px 11px;

            font-size:
                11px;

        }


        /* ==================================================
           EMPTY STATE
        ================================================== */

        .empty {

            grid-column:
                1 / -1;

            position:
                relative;

            padding:
                65px 24px;

            overflow:
                hidden;

            border:
                1px dashed rgba(255, 255, 255, 0.09);

            border-radius:
                18px;

            background:
                rgba(17, 20, 25, 0.65);

            color:
                #626a76;

            text-align:
                center;

            font-size:
                13px;

        }


        .empty::before {

            content:
                "🐒";

            display:
                block;

            margin-bottom:
                12px;

            font-size:
                34px;

            filter:
                grayscale(0.25);

        }


        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            margin-top:
                38px;

            padding:
                22px;

            border-top:
                1px solid rgba(255, 255, 255, 0.045);

            color:
                #424a55;

            text-align:
                center;

            font-size:
                10px;

            letter-spacing:
                0.9px;

        }


        .footer span {

            color:
                #6b7480;

            font-weight:
                800;

        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 900px) {

            .hero-content {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .hero-status {

                align-items:
                    flex-start;

            }

        }


        @media (max-width: 760px) {

            .container {

                width:
                    min(94%, 620px);

                padding-top:
                    20px;

            }


            .hero {

                min-height:
                    auto;

                padding:
                    25px;

                border-radius:
                    22px;

            }


            .brand {

                gap:
                    15px;

            }


            .monkey-logo {

                width:
                    76px;

                height:
                    76px;

                border-radius:
                    19px;

            }


            .monkey-logo span {

                font-size:
                    38px;

            }


            .brand h1 {

                font-size:
                    31px;

                letter-spacing:
                    -1.5px;

            }


            .subtitle {

                font-size:
                    12px;

            }


            .episodes {

                grid-template-columns:
                    repeat(auto-fit,
                        minmax(220px,
                            1fr));

            }

        }


        @media (max-width: 480px) {

            .episodes {

                grid-template-columns:
                    1fr;

            }


            .topbar {

                align-items:
                    stretch;

            }


            .topbar .primary-button {

                width:
                    100%;

            }


            .section-heading {

                width:
                    100%;

            }

        }
    </style>

</head>


<body>

    <div class="container">


        <!-- ==================================================
             HERO
        ================================================== -->

        <header class="hero">

            <div class="hero-grid"></div>


            <div class="hero-content">

                <div class="brand">

                    <div class="monkey-logo">

                        <span>
                            🐒
                        </span>

                    </div>


                    <div>

                        <h1>
                            MONKI <span>LABS</span>
                        </h1>


                        <div class="subtitle">
                            AI Video Studio · Create. Generate. Repeat.
                        </div>

                    </div>

                </div>


                <div class="hero-status">

                    <div class="status-pill">

                        <div class="status-dot"></div>

                        SYSTEM ONLINE

                    </div>


                    <div class="status-caption">
                        Local AI production environment
                    </div>

                </div>

            </div>

        </header>


        <!-- ==================================================
             EPISODES HEADER
        ================================================== -->

        <div class="topbar">

            <div class="section-heading">

                <div class="section-icon">
                    🎬
                </div>


                <h2>
                    Episodes
                </h2>


                <div id="episodeCount" class="episode-count">
                    0
                </div>

            </div>


            <button
                id="createEpisodeButton"
                class="primary-button"
                onclick="createEpisode()"
            >
                ＋ Create New Episode
            </button>

        </div>


        <!-- ==================================================
             PROGRESS
        ================================================== -->

        <div class="progress-section">

            <div class="progress-title">
                Generation Progress
            </div>


            <div id="progressWrapper" class="progress-wrapper">

                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>


                <div class="progress-text">

                    <span id="progressMessage">
                        Ready.
                    </span>


                    <span id="progressPercent">
                        0%
                    </span>

                </div>

            </div>


            <div id="error" class="error"></div>

        </div>


        <!-- ==================================================
             EPISODE GRID
        ================================================== -->

        <div id="episodes" class="episodes">

            <div class="empty">
                Loading episodes...
            </div>

        </div>


        <!-- ==================================================
             FOOTER
        ================================================== -->

        <div class="footer">

            🐒

            <span>
                MONKI LABS
            </span>

            · AI VIDEO STUDIO

        </div>

    </div>


    <script>

        let statusTimer = null;

        let jobRunning = false;


        async function api(
            url,
            options = {}
        ) {

            const response =
                await fetch(
                    url,
                    options
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Request failed."
                );

            }


            return data;

        }


        function setGenerationButtonsDisabled(
            disabled
        ) {

            jobRunning =
                disabled;


            const createButton =
                document.getElementById(
                    "createEpisodeButton"
                );


            if (createButton) {

                createButton.disabled =
                    disabled;

            }


            document
                .querySelectorAll(
                    ".generate-video-button"
                )
                .forEach(
                    button => {

                        button.disabled =
                            disabled;

                    }
                );

        }


        async function createEpisode() {

            if (jobRunning) {

                return;

            }


            const button =
                document.getElementById(
                    "createEpisodeButton"
                );


            button.disabled = true;

            clearError();


            try {

                await api(
                    "/api/episode",
                    {
                        method:
                            "POST"
                    }
                );


                setGenerationButtonsDisabled(
                    true
                );


                startStatusPolling();

            } catch (error) {

                setGenerationButtonsDisabled(
                    false
                );


                showError(
                    error.message
                );

            }

        }


        async function generateVideo(
            episodeId
        ) {

            if (jobRunning) {

                return;

            }


            clearError();


            try {

                setGenerationButtonsDisabled(
                    true
                );


                await api(
                    "/api/video",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    episode_id:
                                        episodeId
                                }
                            )

                    }
                );


                startStatusPolling();

            } catch (error) {

                setGenerationButtonsDisabled(
                    false
                );


                showError(
                    error.message
                );

            }

        }


        function startStatusPolling() {

            const wrapper =
                document.getElementById(
                    "progressWrapper"
                );


            wrapper.classList.add(
                "active"
            );


            setGenerationButtonsDisabled(
                true
            );


            if (statusTimer) {

                clearInterval(
                    statusTimer
                );

            }


            statusTimer =
                setInterval(
                    updateStatus,
                    500
                );


            updateStatus();

        }


        async function updateStatus() {

            try {

                const status =
                    await api(
                        "/api/status"
                    );


                applyStatus(
                    status
                );


                if (status.running) {

                    setGenerationButtonsDisabled(
                        true
                    );


                    return;

                }


                if (statusTimer) {

                    clearInterval(
                        statusTimer
                    );


                    statusTimer = null;

                }


                setGenerationButtonsDisabled(
                    false
                );


                await loadEpisodes();

            } catch (error) {

                showError(
                    error.message
                );

            }

        }


        function applyStatus(
            status
        ) {

            const wrapper =
                document.getElementById(
                    "progressWrapper"
                );


            const fill =
                document.getElementById(
                    "progressFill"
                );


            const percent =
                document.getElementById(
                    "progressPercent"
                );


            const message =
                document.getElementById(
                    "progressMessage"
                );


            const progress =
                Number(
                    status.progress || 0
                );


            fill.style.width =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                ) +
                "%";


            percent.textContent =
                progress +
                "%";


            message.textContent =
                status.message ||
                (
                    status.running
                        ? "Working..."
                        : "Ready."
                );


            if (
                status.running ||
                progress > 0
            ) {

                wrapper.classList.add(
                    "active"
                );

            }


            if (status.error) {

                showError(
                    status.error
                );

            }

        }


        async function restoreStatus() {

            try {

                const status =
                    await api(
                        "/api/status"
                    );


                applyStatus(
                    status
                );


                if (status.running) {

                    setGenerationButtonsDisabled(
                        true
                    );


                    startStatusPolling();

                } else {

                    setGenerationButtonsDisabled(
                        false
                    );

                }

            } catch (error) {

                showError(
                    error.message
                );

            }

        }


        async function loadEpisodes() {

            const container =
                document.getElementById(
                    "episodes"
                );


            try {

                const episodes =
                    await api(
                        "/api/episodes"
                    );


                document
                    .getElementById(
                        "episodeCount"
                    )
                    .textContent =
                    episodes.length;


                if (!episodes.length) {

                    container.innerHTML =
                        '<div class="empty">' +
                        'No episodes yet. Create your first one!' +
                        '</div>';

                    return;

                }


                container.innerHTML =
                    episodes
                        .map(
                            renderEpisode
                        )
                        .join("");


                setGenerationButtonsDisabled(
                    jobRunning
                );


            } catch (error) {

                container.innerHTML =
                    '<div class="empty">' +
                    escapeHtml(
                        error.message
                    ) +
                    '</div>';

            }

        }


        function renderEpisode(
            episode
        ) {

            const number =
                escapeHtml(
                    episode.number
                );


            const category =
                escapeHtml(
                    episode.category
                );


            const title =
                escapeHtml(
                    episode.title ||
                    "Prompt not available"
                );


            const prompt =
                escapeHtml(
                    episode.prompt
                );


            let videoHtml = "";


            if (
                episode.video_exists &&
                episode.video_path
            ) {

                const mediaPath =
                    episode.video_path
                        .split("/")
                        .map(
                            encodeURIComponent
                        )
                        .join("/");


                videoHtml = `

                    <div class="video-heading">

                        <div class="label">
                            Video
                        </div>

                        <div class="video-badge">
                            Ready
                        </div>

                    </div>


                    <div class="video-status">
                        episode.mp4
                    </div>


                    <video
                        controls
                        preload="metadata"
                        playsinline
                        src="/media/${mediaPath}"
                    ></video>


                    <div class="actions">

                        <button
                            class="secondary"
                            disabled
                        >
                            Upload to YouTube
                        </button>

                    </div>

                `;

            } else {

                videoHtml = `

                    <div class="video-heading">

                        <div class="label">
                            Video
                        </div>

                    </div>


                    <div class="video-status">
                        No video generated yet.
                    </div>


                    <div class="actions">

                        <button
                            class="primary-button generate-video-button"
                            ${jobRunning ? "disabled" : ""}
                            onclick="generateVideo(
                                '${escapeJs(
                    episode.path
                )}'
                            )"
                        >
                            Generate Video
                        </button>

                    </div>

                `;

            }


            return `

                <article class="episode-card">

                    <div class="episode-header">

                        <div class="episode-number">
                            #${number}
                        </div>


                        <div class="episode-category">
                            ${category}
                        </div>

                    </div>


                    <div class="episode-content">

                        <div>

                            <div class="label">
                                Prompt
                            </div>


                            ${
                                episode.prompt_exists
                                    ?
                                    `

                                        <div class="title">
                                            ${title}
                                        </div>


                                        <div class="prompt">
                                            ${prompt}
                                        </div>

                                    `
                                    :
                                    `

                                        <div class="prompt-empty">
                                            Prompt not available.
                                        </div>

                                    `
                            }

                        </div>


                        <div class="video-panel">

                            ${videoHtml}

                        </div>

                    </div>

                </article>

            `;

        }


        function showError(
            message
        ) {

            const element =
                document.getElementById(
                    "error"
                );


            element.textContent =
                message;


            element.style.display =
                "block";

        }


        function clearError() {

            const element =
                document.getElementById(
                    "error"
                );


            element.textContent =
                "";


            element.style.display =
                "none";

        }


        function escapeHtml(
            value
        ) {

            return String(
                value
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeJs(
            value
        ) {

            return String(
                value
            )
                .replaceAll(
                    "\\",
                    "\\\\"
                )
                .replaceAll(
                    "'",
                    "\\'"
                )
                .replaceAll(
                    "\n",
                    "\\n"
                )
                .replaceAll(
                    "\r",
                    "\\r"
                );

        }


        async function initializePage() {

            await restoreStatus();

            await loadEpisodes();

        }


        initializePage();

    </script>

</body>

</html>
